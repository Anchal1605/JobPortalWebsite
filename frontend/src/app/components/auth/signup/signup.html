<div class="auth-shell">
  <div class="auth-split-card auth-split-card--signup">
    <div class="auth-split-card__form">
      <div class="auth-card">
        <form (ngSubmit)="submit()" #signupForm="ngForm" class="auth-form">
          <header class="auth-card__head">
            <div class="auth-brand">CareerConnect</div>
            <h1>Create your account</h1>
            <p class="subtitle">Join as a candidate or employer in one step.</p>
          </header>

          @if (message()) {
          <div class="auth-alert" role="status">{{ message() }}</div>
          }

          <div class="auth-form-body">
            <div class="auth-form-fields">
              <div class="field">
                <label for="name">Full name</label>
                <input id="name" name="name" type="text" [(ngModel)]="model.name" placeholder="Alex Morgan"
                  autocomplete="name" required />
              </div>

              <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" [(ngModel)]="model.email" placeholder="you@company.com"
                  autocomplete="email" required />
              </div>

              <div class="field field--password">
                <label for="password">Password</label>
                <div class="password-wrap">
                  <input id="password" [type]="showPassword() ? 'text' : 'password'" name="password"
                    [(ngModel)]="model.password" placeholder="Choose a password" autocomplete="new-password" required />
                  <button type="button" class="password-toggle" (click)="togglePassword()"
                    [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
                    [attr.aria-pressed]="showPassword()">
                    @if (showPassword()) {
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                      <path
                        d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                      <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" />
                    </svg>
                    } @else {
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" />
                      <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" />
                    </svg>
                    }
                  </button>
                </div>
              </div>

              <fieldset class="role-fieldset">
                <legend class="role-legend">I am a…</legend>
                <div class="role-cards" role="radiogroup" aria-label="Account type">
                  <label class="role-card">
                    <input type="radio" name="role" [value]="roleCandidate" [(ngModel)]="model.roleId" required />
                    <span class="role-card__inner">
                      <span class="role-card__icon" aria-hidden="true">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" />
                          <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.8" />
                        </svg>
                      </span>
                      <span class="role-card__title">Candidate</span>
                      <span class="role-card__hint">Apply to jobs</span>
                    </span>
                  </label>
                  <label class="role-card">
                    <input type="radio" name="role" [value]="roleEmployer" [(ngModel)]="model.roleId" />
                    <span class="role-card__inner">
                      <span class="role-card__icon" aria-hidden="true">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                          <path d="M3 21h18M5 21V7l7-4 7 4v14" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round" />
                          <path d="M9 10h6M9 14h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                        </svg>
                      </span>
                      <span class="role-card__title">Employer</span>
                      <span class="role-card__hint">Post jobs</span>
                    </span>
                  </label>
                </div>
              </fieldset>
            </div>

            <button type="submit" class="auth-submit" [disabled]="loading() || !signupForm.valid || !model.roleId">
              {{ loading() ? 'Creating account…' : 'Create account' }}
            </button>
            <p class="auth-footer">
              Already have an account?
              <a routerLink="/auth/login">Sign in</a>
            </p>
          </div>
        </form>
      </div>
    </div>

    <aside class="auth-split-card__visual" aria-hidden="true">
      <div class="auth-split-card__visual-bg"
        style="background-image: url('https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&amp;fit=crop&amp;w=800&amp;q=80')">
      </div>
      <div class="auth-split-card__visual-scrim"></div>
      <div class="auth-split-card__visual-content">
        <div class="auth-split-card__visual-mark">
          <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
            <rect width="40" height="40" rx="10" fill="rgb(37 99 235 / 0.12)" />
            <path d="M12 26V14l8 5 8-5v12" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
            <path d="M12 14l8 5 8-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <span>CareerConnect</span>
        </div>
        <p class="auth-split-card__visual-title">Get started today</p>
        <p class="auth-split-card__visual-lead">Whether you're hiring top talent or searching for your next opportunity,
          everything starts here.</p>
        <svg class="auth-split-card__illustration" viewBox="0 0 240 160" fill="none" aria-hidden="true">
          <rect x="40" y="72" width="160" height="56" rx="8" fill="#fff" stroke="rgb(37 99 235 / 0.3)"
            stroke-width="2" />
          <rect x="52" y="84" width="56" height="10" rx="2" fill="rgb(37 99 235 / 0.15)" />
          <rect x="52" y="100" width="96" height="8" rx="2" fill="rgb(148 163 184 / 0.35)" />
          <rect x="52" y="112" width="72" height="8" rx="2" fill="rgb(148 163 184 / 0.25)" />
          <circle cx="176" cy="100" r="18" fill="rgb(14 165 233 / 0.25)" />
          <path d="M168 100l6 6 14-14" stroke="rgb(37 99 235 / 0.6)" stroke-width="2.5" stroke-linecap="round"
            stroke-linejoin="round" />
          <rect x="96" y="28" width="48" height="36" rx="4" fill="rgb(37 99 235 / 0.12)" />
          <circle cx="120" cy="46" r="8" fill="rgb(37 99 235 / 0.35)" />
        </svg>
      </div>
    </aside>
  </div>
</div>
