<div class="auth-shell">
  <div class="auth-split-card">
    <div class="auth-split-card__form">
      <div class="auth-card">
        <form (ngSubmit)="submit()" #loginForm="ngForm" class="auth-form">
          <header class="auth-card__head">
            <div class="auth-brand">CareerConnect</div>
            <h1>Welcome back</h1>
            <p class="subtitle">Sign in with your email and password.</p>
          </header>

          @if (message()) {
          <div class="auth-alert" role="status">{{ message() }}</div>
          }

          <div class="auth-form-body">
            <div class="auth-form-fields">
              <div class="field">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" [(ngModel)]="model.email" placeholder="you@company.com"
                  autocomplete="email" required />
              </div>

              <div class="field field--password">
                <label for="password">Password</label>
                <div class="password-wrap">
                  <input id="password" [type]="showPassword() ? 'text' : 'password'" name="password"
                    [(ngModel)]="model.password" placeholder="Enter your password" autocomplete="current-password"
                    required />
                  <button type="button" class="password-toggle" (click)="togglePassword()"
                    [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
                    [attr.aria-pressed]="showPassword()">
                    @if (showPassword()) {
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                      <path
                        d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                      <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" />
                    </svg>
                    } @else {
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" />
                      <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" />
                    </svg>
                    }
                  </button>
                </div>
              </div>
            </div>

            <button type="submit" class="auth-submit" [disabled]="loading() || !loginForm.valid">
              {{ loading() ? 'Signing in…' : 'Sign in' }}
            </button>
            <p class="auth-footer">
              New here?
              <a routerLink="/auth/signup">Create an account</a>
            </p>
          </div>
        </form>
      </div>
    </div>

    <aside class="auth-split-card__visual" aria-hidden="true">
      <div class="auth-split-card__visual-bg"
        style="background-image: url('https://images.unsplash.com/photo-1497215728101-856f4ea42174?auto=format&amp;fit=crop&amp;w=800&amp;q=80')">
      </div>
      <div class="auth-split-card__visual-scrim"></div>
      <div class="auth-split-card__visual-content">
        <div class="auth-split-card__visual-mark">
          <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
            <rect width="40" height="40" rx="10" fill="rgb(37 99 235 / 0.12)" />
            <path d="M12 26V14l8 5 8-5v12" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
            <path d="M12 14l8 5 8-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <span>CareerConnect</span>
        </div>
        <p class="auth-split-card__visual-title">Continue where you left off</p>
        <p class="auth-split-card__visual-lead">Access your dashboard to track jobs, candidates, and applications.</p>
        <svg class="auth-split-card__illustration" viewBox="0 0 240 160" fill="none" aria-hidden="true">
          <rect x="32" y="88" width="176" height="8" rx="4" fill="rgb(37 99 235 / 0.15)" />
          <rect x="72" y="48" width="96" height="56" rx="6" fill="#fff" stroke="rgb(37 99 235 / 0.35)"
            stroke-width="2" />
          <rect x="80" y="56" width="80" height="36" rx="3" fill="rgb(37 99 235 / 0.08)" />
          <circle cx="120" cy="36" r="14" fill="rgb(14 165 233 / 0.35)" />
          <path d="M104 52c8-12 24-12 32 0v8h-32v-8z" fill="rgb(37 99 235 / 0.45)" />
          <rect x="188" y="28" width="24" height="40" rx="4" fill="rgb(37 99 235 / 0.2)" />
          <rect x="194" y="34" width="4" height="28" rx="1" fill="rgb(37 99 235 / 0.45)" />
          <ellipse cx="200" cy="26" rx="10" ry="6" fill="rgb(251 191 36 / 0.5)" />
          <rect x="28" y="56" width="20" height="28" rx="3" fill="rgb(16 185 129 / 0.25)" />
        </svg>
      </div>
    </aside>
  </div>
</div>
