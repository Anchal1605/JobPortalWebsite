<div class="toast-stack" aria-live="polite" aria-relevant="additions">
  @for (item of toast.items(); track item.id) {
  <div class="toast toast--{{ item.variant }}" role="status">
    <span class="toast__icon" aria-hidden="true">
      @if (item.variant === 'success') {
      ✓
      } @else if (item.variant === 'error') {
      !
      } @else {
      i
      }
    </span>
    <p class="toast__message">{{ item.message }}</p>
    <button type="button" class="toast__close" (click)="dismiss(item.id)" aria-label="Dismiss">×</button>
  </div>
  }
</div>
